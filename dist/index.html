<title>EasyFlow FlexoCAD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: ferramenta de tela única — barra de fichas no topo, palco 3D ao centro com painel lateral recolhível, controles de dobra embaixo */
:root{
  --bg:#ebe9e3; --stage:#e1ded5; --panel:#f8f7f3; --fg:#22201b; --muted:#6d685d; --line:#d2cdc0;
  --accent:#9a6a26; --accent-fg:#fffaf0; --ok:#3f6b37; --warn-bg:#f6e3d6; --warn-fg:#8a3214; --sel:#2a6fdb;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1a17; --stage:#24231f; --panel:#2b2925; --fg:#eeeae0; --muted:#a59f91; --line:#3d3a34;
  --accent:#d6a55c; --accent-fg:#1b1a17; --ok:#9cc98f; --warn-bg:#3d2318; --warn-fg:#f2b79a; --sel:#7fb0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1a17; --stage:#24231f; --panel:#2b2925; --fg:#eeeae0; --muted:#a59f91; --line:#3d3a34;
  --accent:#d6a55c; --accent-fg:#1b1a17; --ok:#9cc98f; --warn-bg:#3d2318; --warn-fg:#f2b79a; --sel:#7fb0ff; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;border-bottom:1px solid var(--line)}
.brand{font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 20px var(--display);margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}
h1 small{font-weight:500;color:var(--muted);font-size:14px;margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;background:var(--panel)}
.chip b{font-weight:600}
.chip .role{font:600 10px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip button{border:0;background:none;padding:0 6px;font-size:14px;line-height:1;color:var(--muted);cursor:pointer}
button,.filebtn{font:600 13px var(--display);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:7px 12px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;position:relative}
button:hover,.filebtn:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,.filebtn:focus-within,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:disabled{opacity:.45;cursor:default}
.filebtn{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.specs{padding-block:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.specs b{color:var(--fg);font-weight:500}
.specs .style{font:600 13px var(--display);letter-spacing:.03em;color:var(--fg);text-transform:uppercase}
.specs .src{font-family:var(--body)}
.specs .src.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.specs .src.warn{color:var(--warn-fg)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.pieces{display:inline-flex;align-items:center;gap:4px;font-family:var(--body)}
.pieces button{padding:3px 9px;font-size:12px}
.tools button{padding:5px 10px;font-size:12px}
.msg{padding-block:8px;background:var(--warn-bg);color:var(--warn-fg);font-size:13px}
main{flex:1;min-height:0;display:flex}
.stage{position:relative;flex:1;min-width:0;min-height:0;background:var(--stage)}
canvas#c{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}
.views{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:4px}
.views button{padding:5px 10px;font-size:12px;justify-content:center}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:10px;font-size:12px;color:var(--muted);pointer-events:none;max-width:70%}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:8px;background:color-mix(in srgb,var(--stage) 85%,transparent);display:flex;align-items:center;justify-content:center;text-align:center;font:600 18px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);pointer-events:none;padding:16px}
.busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--stage) 78%,transparent);font:600 15px var(--display);letter-spacing:.06em;text-transform:uppercase}
aside{width:340px;max-width:100%;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
aside h2{font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
aside h2 button{padding:2px 8px;font-size:16px}
aside p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.field{display:grid;gap:6px}
.field label,.lbl{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row button{padding:5px 9px;font-size:12px}
input[type=number],select,textarea{font:13px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
input[type=number]{width:90px}
textarea{width:100%;min-height:90px;box-sizing:border-box;resize:vertical}
.sel{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:10px}
.sel .t{font:600 14px var(--display);letter-spacing:.02em}
.sel .t span{color:var(--muted);font:12px var(--mono);margin-left:6px}
table.conf{width:100%;border-collapse:collapse;font:12px var(--mono);font-variant-numeric:tabular-nums}
table.conf th{font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px}
table.conf th:first-child,table.conf td:first-child{text-align:left;font-family:var(--body)}
table.conf td{text-align:right;padding:5px 4px;border-top:1px solid var(--line)}
td.bad{color:var(--warn-fg);font-weight:600}
td.good{color:var(--ok)}
.overlay{width:100%;aspect-ratio:1.6;max-width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:3px;margin-right:5px}
.layers label{display:flex;align-items:center;gap:8px;font-size:13px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid var(--line)}
.controls{padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
#play{background:var(--fg);color:var(--bg);border-color:var(--fg);min-width:100px;justify-content:center}
.fold{flex:1;min-width:200px;display:flex;flex-direction:column;gap:3px}
.fold input{width:100%;accent-color:var(--accent)}
.ticks{display:flex;justify-content:space-between;font:600 11px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ticks span.act{color:var(--fg)}
.pct{font:13px var(--mono);width:44px;text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20;max-width:90vw}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:auto;border-left:0;border-top:1px solid var(--line);flex:0 0 48%;max-height:48%}
  .hint{display:none}
  .views{flex-direction:row;flex-wrap:wrap;left:max(10px,env(safe-area-inset-left,0px));justify-content:flex-end}
  .specs{gap:4px 12px}
  .tools{margin-left:0}
  h1{font-size:17px}
  .controls{gap:8px 10px}
  #play{min-width:84px}
  .fold{min-width:0;flex-basis:120px}
  .ticks span:nth-child(2){display:none}
}
</style>

<header class="pad">
  <span class="brand">EasyFlow <b style="color:var(--accent)">FlexoCAD</b></span>
  <h1 id="title">Exemplo</h1>
  <div class="chips" id="chips"></div>
  <label class="filebtn" id="pick">Enviar PDF<input type="file" id="file" accept="application/pdf,.pdf" multiple></label>
</header>
<div class="specs pad" id="specs"></div>
<div class="msg pad" id="msg" hidden></div>

<main>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Caixa em 3D"></canvas>
    <div class="views" role="group" aria-label="Vistas">
      <button data-view="iso" id="v-iso">3/4</button>
      <button data-view="front" id="v-front">Frente</button>
      <button data-view="side" id="v-side">Lateral</button>
      <button data-view="top" id="v-top">Topo</button>
      <button data-view="back" id="v-back">Verso</button>
      <button data-view="under" id="v-under">Fundo</button>
    </div>
    <div class="hint" id="hint">Arraste para girar · role ou pince para zoom · solte aqui a ficha de impressão e, se tiver, a ficha técnica</div>
    <div class="drop" id="drop" hidden>Solte os PDFs: ficha de impressão e/ou ficha técnica</div>
    <div class="busy" id="busy" hidden>Lendo o PDF…</div>
  </div>
  <aside id="side" hidden></aside>
</main>

<div class="controls pad">
  <button id="play">Abrir</button>
  <div class="fold">
    <input type="range" id="fold" min="0" max="1000" value="1000" aria-label="Dobra">
    <div class="ticks" id="ticks"></div>
  </div>
  <span class="pct" id="pct">100%</span>
  <button id="spin">Girar</button>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
// ===== Leitor vetorial =====
// Lê a lista de operações do pdf.js e devolve todos os traços (com cor, espessura, tracejado)
// e preenchimentos como polilinhas em coordenadas da página (pt, origem no canto superior esquerdo),
// além dos textos com posição. Funciona no navegador e no Node (pdfjs-dist).
const PDFVec = (() => {
  const IDENT = [1, 0, 0, 1, 0, 0];
  const mul = (m, n) => [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]];
  const toHex = a => {
    if (!a) return null;
    if (typeof a === 'string') return a.toLowerCase();
    if (typeof a[0] === 'string') return a[0].toLowerCase();
    return '#' + [a[0], a[1], a[2]].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  };
  function bez(p0, p1, p2, p3, out) {
    const n = Math.max(4, Math.min(24, Math.ceil((Math.hypot(p1[0]-p0[0], p1[1]-p0[1]) + Math.hypot(p2[0]-p1[0], p2[1]-p1[1]) + Math.hypot(p3[0]-p2[0], p3[1]-p2[1])) / 3)));
    for (let i = 1; i <= n; i++) {
      const t = i / n, u = 1 - t;
      out.push([u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]);
    }
  }

  async function read(pdfjsLib, page) {
    const OPS = pdfjsLib.OPS;
    const vp = page.getViewport({ scale: 1 });
    const V = vp.transform;                // PDF -> página (y para baixo)
    const ol = await page.getOperatorList();
    const st = { ctm: IDENT, stroke: '#000000', fill: '#000000', lw: 1, dash: [] };
    const stack = [];
    let subs = [], cur = null, curved = false;
    const paths = [];
    const P = (x, y) => { const m = mul(V, st.ctm); return [m[0]*x + m[2]*y + m[4], m[1]*x + m[3]*y + m[5]]; };
    const scaleOf = () => { const m = mul(V, st.ctm); return Math.sqrt(Math.abs(m[0]*m[3] - m[1]*m[2])); };
    const emit = (stroke, fill) => {
      const s = subs.filter(sp => sp.pts.length > 1);
      if (s.length) {
        const k = scaleOf();
        paths.push({
          stroke: stroke ? st.stroke : null, fill: fill ? st.fill : null,
          width: st.lw * k, dash: (st.dash || []).map(d => d * k),
          subs: s.map(sp => ({ pts: sp.pts, closed: sp.closed })), curved,
        });
      }
      subs = []; cur = null; curved = false;
    };
    const { fnArray: fn, argsArray: args } = ol;
    for (let i = 0; i < fn.length; i++) {
      const f = fn[i], a = args[i];
      switch (f) {
        case OPS.save: stack.push({ ...st }); break;
        case OPS.restore: Object.assign(st, stack.pop() || {}); break;
        case OPS.transform: st.ctm = mul(st.ctm, a); break;
        case OPS.setStrokeRGBColor: st.stroke = toHex(a); break;
        case OPS.setFillRGBColor: st.fill = toHex(a); break;
        case OPS.setLineWidth: st.lw = a[0]; break;
        case OPS.setDash: st.dash = Array.from(a[0] || []); break;
        case OPS.setGState:
          for (const [k, v] of a[0]) { if (k === 'LW') st.lw = v; else if (k === 'D') st.dash = Array.from(v[0] || []); }
          break;
        case OPS.constructPath: {
          const ops = a[0], c = a[1]; let k = 0;
          for (const op of ops) {
            if (op === OPS.moveTo) { cur = { pts: [P(c[k], c[k+1])], closed: false }; subs.push(cur); k += 2; }
            else if (op === OPS.lineTo) { if (!cur) { cur = { pts: [], closed: false }; subs.push(cur); } cur.pts.push(P(c[k], c[k+1])); k += 2; }
            else if (op === OPS.curveTo || op === OPS.curveTo2 || op === OPS.curveTo3) {
              const n = op === OPS.curveTo ? 6 : 4;
              if (cur && cur.pts.length) {
                const p0 = cur.pts[cur.pts.length - 1];
                let p1, p2, p3;
                if (op === OPS.curveTo) { p1 = P(c[k], c[k+1]); p2 = P(c[k+2], c[k+3]); p3 = P(c[k+4], c[k+5]); }
                else if (op === OPS.curveTo2) { p1 = p0; p2 = P(c[k], c[k+1]); p3 = P(c[k+2], c[k+3]); }
                else { p1 = P(c[k], c[k+1]); p2 = P(c[k+2], c[k+3]); p3 = p2; }
                bez(p0, p1, p2, p3, cur.pts); curved = true;
              }
              k += n;
            }
            else if (op === OPS.closePath) { if (cur && cur.pts.length) { cur.closed = true; const s = cur.pts[0]; cur = { pts: [s], closed: false }; subs.push(cur); } }
            else if (op === OPS.rectangle) {
              const x = c[k], y = c[k+1], w = c[k+2], h = c[k+3]; k += 4;
              subs.push({ pts: [P(x, y), P(x + w, y), P(x + w, y + h), P(x, y + h)], closed: true }); cur = null;
            }
          }
          break;
        }
        case OPS.stroke: case OPS.closeStroke: emit(true, false); break;
        case OPS.fill: case OPS.eoFill: emit(false, true); break;
        case OPS.fillStroke: case OPS.eoFillStroke: case OPS.closeFillStroke: case OPS.closeEOFillStroke: emit(true, true); break;
        case OPS.endPath: subs = []; cur = null; curved = false; break;
      }
    }
    const tc = await page.getTextContent();
    const texts = tc.items.filter(t => t.str && t.str.trim()).map(t => {
      const m = mul(V, t.transform);
      return { str: t.str, x: m[4], y: m[5], size: Math.hypot(m[2], m[3]), w: t.width, angle: Math.atan2(m[1], m[0]) };
    });
    return { width: vp.width, height: vp.height, paths, texts };
  }
  return { read };
})();


// ===== Faca → painéis =====
// Recebe os traços do PDF (PDFVec) e devolve a faca como grafo planar:
// painéis (faces), furos, vincos (dobradiças), picotes e cortes soltos.
const Dieline = (() => {
  const CUT = 'cut', CREASE = 'crease', PERF = 'perf', UNK = 'unk';

  // ---------- utilidades geométricas ----------
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const crs = (a, b) => a[0] * b[1] - a[1] * b[0];
  const len = a => Math.hypot(a[0], a[1]);
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  function polyArea(p) { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }
  function pointInPoly(pt, poly) {
    let c = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a[1] > pt[1]) !== (b[1] > pt[1]) && pt[0] < (b[0] - a[0]) * (pt[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
  function interiorPoint(poly) {
    // ponto garantidamente dentro: varredura horizontal no meio da altura
    let y0 = Infinity, y1 = -Infinity;
    for (const p of poly) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    for (const f of [0.5, 0.37, 0.63, 0.25, 0.75, 0.12, 0.88]) {
      const y = y0 + (y1 - y0) * f, xs = [];
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i], b = poly[(i + 1) % poly.length];
        if ((a[1] > y) !== (b[1] > y)) xs.push(a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]));
      }
      xs.sort((p, q) => p - q);
      let best = null, bw = 0;
      for (let i = 0; i + 1 < xs.length; i += 2) if (xs[i + 1] - xs[i] > bw) { bw = xs[i + 1] - xs[i]; best = [(xs[i] + xs[i + 1]) / 2, y]; }
      if (best) return best;
    }
    return poly[0];
  }

  // ---------- classificação de traços ----------
  function dashKind(d) {
    if (!d || !d.length || d.every(v => v === 0)) return CUT;
    const nz = d.filter(v => v > 0);
    if (nz.length >= 2 && Math.max(...nz) / Math.min(...nz) > 1.6) return PERF;  // traço-ponto (traços de tamanhos diferentes)
    return CREASE;
  }
  const hexRGB = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const isWhite = h => { const [r, g, b] = hexRGB(h); return r > 235 && g > 235 && b > 235; };

  // Agrupa traços por caneta (cor + espessura + tipo) e escolhe quais podem ser faca.
  function pens(vec) {
    const groups = new Map();
    vec.paths.forEach((p, i) => {
      if (!p.stroke || isWhite(p.stroke)) return;
      const kind = dashKind(p.dash);
      const key = `${p.stroke}|${p.width.toFixed(2)}|${kind}`;
      let g = groups.get(key);
      if (!g) groups.set(key, g = { key, color: p.stroke, width: p.width, kind, paths: [], x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9, length: 0 });
      g.paths.push(i);
      for (const s of p.subs) {
        for (let k = 0; k < s.pts.length; k++) {
          const q = s.pts[k];
          g.x0 = Math.min(g.x0, q[0]); g.y0 = Math.min(g.y0, q[1]); g.x1 = Math.max(g.x1, q[0]); g.y1 = Math.max(g.y1, q[1]);
          if (k) g.length += len(sub(q, s.pts[k - 1]));
        }
      }
    });
    return [...groups.values()];
  }

  // ---------- grafo planar ----------
  function buildGraph(segs, tol) {
    // segs: {a, b, kind}
    // 1) pontos de quebra por interseção / encostos
    const cell = Math.max(tol * 8, 1);
    const grid = new Map();
    const keyOf = (i, j) => i + ',' + j;
    segs.forEach((s, idx) => {
      s.t = [0, 1];
      const x0 = Math.min(s.a[0], s.b[0]) - tol, x1 = Math.max(s.a[0], s.b[0]) + tol;
      const y0 = Math.min(s.a[1], s.b[1]) - tol, y1 = Math.max(s.a[1], s.b[1]) + tol;
      for (let i = Math.floor(x0 / cell); i <= Math.floor(x1 / cell); i++)
        for (let j = Math.floor(y0 / cell); j <= Math.floor(y1 / cell); j++) {
          const k = keyOf(i, j); let c = grid.get(k); if (!c) grid.set(k, c = []); c.push(idx);
        }
    });
    const seen = new Set();
    const projT = (p, s) => { const d = sub(s.b, s.a), L2 = dot(d, d); if (!L2) return null; const t = dot(sub(p, s.a), d) / L2; return { t, dist: len(sub(p, lerp(s.a, s.b, t))) }; };
    for (const list of grid.values()) {
      for (let x = 0; x < list.length; x++) for (let y = x + 1; y < list.length; y++) {
        const i = list[x], j = list[y];
        const pk = i < j ? i * 1e6 + j : j * 1e6 + i;
        if (seen.has(pk)) continue; seen.add(pk);
        const s = segs[i], r = segs[j];
        const d1 = sub(s.b, s.a), d2 = sub(r.b, r.a);
        const L1 = len(d1), L2 = len(d2);
        if (!L1 || !L2) continue;
        const den = crs(d1, d2);
        if (Math.abs(den) / (L1 * L2) > 1e-3) {
          const w = sub(r.a, s.a);
          const t = crs(w, d2) / den, u = crs(w, d1) / den;
          const et = tol / L1, eu = tol / L2;
          if (t > -et && t < 1 + et && u > -eu && u < 1 + eu) {
            s.t.push(Math.min(1, Math.max(0, t))); r.t.push(Math.min(1, Math.max(0, u)));
          }
        }
        // encostos (T e sobreposição colinear)
        for (const [p, other] of [[s.a, r], [s.b, r], [r.a, s], [r.b, s]]) {
          const q = projT(p, other);
          if (q && q.dist < tol && q.t > 0 && q.t < 1) other.t.push(q.t);
        }
      }
    }
    // 2) nós por aglutinação transitiva (pontos a menos de tol viram o mesmo nó)
    const P = [];
    for (const s of segs) {
      s.ts = [...new Set(s.t.map(v => Math.round(v * 1e6) / 1e6))].sort((a, b) => a - b);
      s.pid = s.ts.map(t => { P.push(lerp(s.a, s.b, t)); return P.length - 1; });
    }
    const par = P.map((_, i) => i);
    const find = i => { while (par[i] !== i) i = par[i] = par[par[i]]; return i; };
    const box = P.map(p => [p[0], p[1], p[0], p[1]]);
    const pg = new Map();
    P.forEach((p, i) => { const k = keyOf(Math.floor(p[0] / tol), Math.floor(p[1] / tol)); let c = pg.get(k); if (!c) pg.set(k, c = []); c.push(i); });
    P.forEach((p, i) => {
      const ci = Math.floor(p[0] / tol), cj = Math.floor(p[1] / tol);
      for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
        const c = pg.get(keyOf(ci + di, cj + dj)); if (!c) continue;
        for (const j of c) if (j > i && len(sub(P[j], p)) <= tol) {
          const a = find(i), b = find(j); if (a === b) continue;
          const A = box[a], B = box[b];
          const nb = [Math.min(A[0], B[0]), Math.min(A[1], B[1]), Math.max(A[2], B[2]), Math.max(A[3], B[3])];
          if (Math.hypot(nb[2] - nb[0], nb[3] - nb[1]) > tol * 2.5) continue;   // não deixa um nó "engolir" uma curva inteira
          par[a] = b; box[b] = nb;
        }
      }
    });
    const nodes = [], nid = new Map();
    P.forEach((p, i) => { const r = find(i); let n = nid.get(r); if (n === undefined) { n = nodes.length; nid.set(r, n); nodes.push({ p: [0, 0], c: 0, out: [] }); } nodes[n].p[0] += p[0]; nodes[n].p[1] += p[1]; nodes[n].c++; });
    nodes.forEach(n => { n.p[0] /= n.c; n.p[1] /= n.c; });
    const edgeMap = new Map(), edges = [];
    const rank = { crease: 3, perf: 1, cut: 2, unk: 0 };
    for (const s of segs) {
      let prev = nid.get(find(s.pid[0]));
      for (let k = 1; k < s.pid.length; k++) {
        const n = nid.get(find(s.pid[k]));
        if (n !== prev) {
          const key = prev < n ? prev + '_' + n : n + '_' + prev;
          const e = edgeMap.get(key);
          if (!e) { const ne = { u: prev, v: n, kind: s.kind, src: s.src }; edgeMap.set(key, ne); edges.push(ne); }
          else if (rank[s.kind] > rank[e.kind]) e.kind = s.kind;
        }
        prev = n;
      }
    }
    return { nodes, edges };
  }

  // Estende pontas soltas de vinco/corte até encostar no traço mais próximo (desenhos com folga).
  function extendDangling(segs, tol, reach) {
    const deg = new Map();
    const k = p => Math.round(p[0] / tol) + ',' + Math.round(p[1] / tol);
    for (const s of segs) for (const p of [s.a, s.b]) deg.set(k(p), (deg.get(k(p)) || 0) + 1);
    const near = (p) => {
      for (const s of segs) {
        for (const q of [s.a, s.b]) if (q !== p && len(sub(p, q)) < tol) return true;
        const d = sub(s.b, s.a), L2 = dot(d, d); if (!L2) continue;
        const t = dot(sub(p, s.a), d) / L2;
        if (t > 0 && t < 1 && len(sub(p, lerp(s.a, s.b, t))) < tol) return true;
      }
      return false;
    };
    for (const s of segs) {
      if (s.kind === PERF) continue;
      for (const end of ['a', 'b']) {
        const p = s[end], o = end === 'a' ? s.b : s.a;
        if (deg.get(k(p)) > 1 || near(p)) continue;
        const dir = sub(p, o), L = len(dir); if (!L) continue;
        const u = [dir[0] / L, dir[1] / L];
        let best = Infinity;
        for (const r of segs) {
          if (r === s) continue;
          const d2 = sub(r.b, r.a), den = crs(u, d2);
          if (Math.abs(den) < 1e-9) continue;
          const w = sub(r.a, p);
          const t = crs(w, d2) / den, q = crs(w, u) / den;
          if (t > 0 && t < reach && q >= -0.001 && q <= 1.001) best = Math.min(best, t);
        }
        if (best < Infinity) s[end] = [p[0] + u[0] * best, p[1] + u[1] * best];
      }
    }
    // pontas soltas próximas entre si: liga com um corte curto (desenhos com pequenas falhas)
    const deg2 = new Map();
    for (const s of segs) for (const p of [s.a, s.b]) deg2.set(k(p), (deg2.get(k(p)) || 0) + 1);
    const loose = [];
    for (const s of segs) { if (s.kind === PERF) continue; for (const p of [s.a, s.b]) if (deg2.get(k(p)) === 1 && !near(p)) loose.push(p); }
    const used = new Set();
    loose.forEach((p, i) => {
      if (used.has(i)) return;
      let bj = -1, bd = tol * 6;
      loose.forEach((q, j) => { if (j !== i && !used.has(j)) { const d = len(sub(p, q)); if (d < bd) { bd = d; bj = j; } } });
      if (bj >= 0) { used.add(i); used.add(bj); segs.push({ a: p, b: loose[bj], kind: CUT, src: -1 }); }
    });
  }

  function faces(graph) {
    const { nodes, edges } = graph;
    // poda de pontas soltas (cortes que não fecham região)
    const deg = nodes.map(() => 0);
    const alive = edges.map(() => true);
    edges.forEach(e => { deg[e.u]++; deg[e.v]++; });
    let changed = true;
    const dangling = [];
    while (changed) {
      changed = false;
      edges.forEach((e, i) => {
        if (alive[i] && (deg[e.u] === 1 || deg[e.v] === 1)) { alive[i] = false; deg[e.u]--; deg[e.v]--; changed = true; dangling.push(e); }
      });
    }
    nodes.forEach(n => n.out = []);
    const half = [];
    edges.forEach((e, i) => {
      if (!alive[i]) return;
      const h1 = { from: e.u, to: e.v, edge: i }, h2 = { from: e.v, to: e.u, edge: i };
      h1.twin = h2; h2.twin = h1; half.push(h1, h2);
      nodes[e.u].out.push(h1); nodes[e.v].out.push(h2);
    });
    for (const n of nodes) {
      for (const h of n.out) { const q = nodes[h.to].p; h.ang = Math.atan2(q[1] - n.p[1], q[0] - n.p[0]); }
      n.out.sort((a, b) => a.ang - b.ang);
      n.out.forEach((h, i) => h.idx = i);
    }
    const loops = [];
    for (const h of half) {
      if (h.loop !== undefined) continue;
      const loop = { hs: [], id: loops.length };
      let c = h, guard = 0;
      while (c.loop === undefined && guard++ < 1e6) {
        c.loop = loop.id; loop.hs.push(c);
        const out = nodes[c.to].out, tw = c.twin;
        c = out[(tw.idx - 1 + out.length) % out.length];
      }
      loop.poly = loop.hs.map(x => nodes[x.from].p);
      loop.area = polyArea(loop.poly);
      loops.push(loop);
    }
    return { loops, half, alive, dangling };
  }

  // ---------- leitura de medidas no texto ----------
  function numbersIn(texts) {
    const all = texts.map(t => t.str).join('\n');
    const tuples = [];
    for (const m of all.matchAll(/\d+(?:[.,]\d+)?(?:\s*[xX×\-–]\s*\d+(?:[.,]\d+)?)+/g)) {
      const t = m[0].split(/\s*[xX×\-–]\s*/).filter(Boolean).map(v => parseFloat(v.replace(',', '.')));
      if (t.length >= 2) tuples.push({ t, sep: /[xX×]/.test(m[0]) ? 'x' : '-', str: m[0] });
    }
    return tuples;
  }
  function field(texts, label) {
    // valor à direita de um rótulo (mesma linha)
    const lab = texts.find(t => t.str.replace(/\s+/g, ' ').trim().toLowerCase().startsWith(label.toLowerCase()));
    if (!lab) return null;
    const inline = lab.str.slice(lab.str.indexOf(':') + 1).trim();
    if (inline && inline !== lab.str.trim()) return inline;
    const cand = texts.filter(t => t !== lab && Math.abs(t.y - lab.y) < lab.size * 0.8 && t.x > lab.x).sort((a, b) => a.x - b.x);
    return cand.length ? cand[0].str.trim() : null;
  }

  // ---------- análise principal ----------
  function analyze(vec, opts = {}) {
    const pageDiag = Math.hypot(vec.width, vec.height);
    const all = pens(vec);
    // descarta canetas de moldura/carimbo: traço contínuo cobrindo quase a página toda
    // moldura da folha: retângulos simples cobrindo quase a página toda
    const frameLike = g => g.kind === CUT && (g.x1 - g.x0) > vec.width * 0.8 && (g.y1 - g.y0) > vec.height * 0.8 &&
      g.paths.every(pi => vec.paths[pi].subs.every(sp => sp.pts.length <= 5));
    // canetas candidatas por cor
    const byColor = new Map();
    for (const g of all) { if (frameLike(g)) continue; let c = byColor.get(g.color); if (!c) byColor.set(g.color, c = []); c.push(g); }
    const results = [];
    // Variantes de leitura (cada fornecedor marca o vinco de um jeito):
    //  1) vinco tracejado e corte contínuo, na mesma cor (Trombini, Flexograv, fichas técnicas)
    //  2) só traço-ponto na cor: o traço-ponto é o vinco (exportações tipo ArtiosCAD)
    //  3) mesma cor, linhas contínuas: a mais fina é o vinco
    //  4) cores diferentes: uma cor é o corte e a outra, contínua, é o vinco (ex.: preto = corte, vermelho = vinco)
    const variants = [];
    const as = (g, kind) => ({ ...g, kind });
    const lenOf = gs => gs.reduce((s, g) => s + g.length, 0);
    for (const [color, gs] of byColor) {
      const hasCrease = gs.some(g => g.kind === CREASE && g.length > pageDiag * 0.05);
      const hasPerf = gs.some(g => g.kind === PERF && g.length > pageDiag * 0.05);
      let groups = gs;
      if (!hasCrease && hasPerf) groups = gs.map(g => g.kind === PERF ? as(g, CREASE) : g);
      const creaseW = groups.filter(g => g.kind === CREASE).map(g => g.width);
      // linhas bem mais finas que o vinco são cotas e anotações
      const minW = creaseW.length ? Math.min(...creaseW) * 0.5 : 0;
      // corte: a caneta contínua mais usada; contínuas bem mais finas que ela são cotas, moldura e anotações
      // (escolhe a caneta em que as pontas dos vincos encostam: cota, moldura e "perfil" não encostam nos vincos)
      const cr = groups.filter(g => g.kind === CREASE);
      const ends = [];
      for (const g of cr) for (const pi of g.paths) for (const sp of vec.paths[pi].subs) if (sp.pts.length > 1) ends.push(sp.pts[0], sp.pts[sp.pts.length - 1]);
      const touch = g => {
        if (!ends.length) return g.length;
        const segs = [];
        for (const pi of g.paths) for (const sp of vec.paths[pi].subs) for (let k = 1; k < sp.pts.length; k++) segs.push([sp.pts[k - 1], sp.pts[k]]);
        const tolE = Math.max(g.width * 2, pageDiag * 0.0015);
        const cell = tolE * 4, grid = new Map(), key = (i, j) => i + ',' + j;
        segs.forEach((q, i) => { const x0 = Math.floor((Math.min(q[0][0], q[1][0]) - tolE) / cell), x1 = Math.floor((Math.max(q[0][0], q[1][0]) + tolE) / cell), y0 = Math.floor((Math.min(q[0][1], q[1][1]) - tolE) / cell), y1 = Math.floor((Math.max(q[0][1], q[1][1]) + tolE) / cell);
          if ((x1 - x0 + 1) * (y1 - y0 + 1) > 4000) return;
          for (let a = x0; a <= x1; a++) for (let c = y0; c <= y1; c++) { const k = key(a, c); let l = grid.get(k); if (!l) grid.set(k, l = []); l.push(i); } });
        let hits = 0;
        for (const p of ends) {
          const l = grid.get(key(Math.floor(p[0] / cell), Math.floor(p[1] / cell))) || [];
          if (l.some(i => { const [a, b] = segs[i], d = sub(b, a), L2 = dot(d, d); const t = L2 ? Math.max(0, Math.min(1, dot(sub(p, a), d) / L2)) : 0; return len(sub(p, lerp(a, b, t))) <= tolE; })) hits++;
        }
        return hits + g.length * 1e-6;
      };
      const solids = groups.filter(g => g.kind === CUT).map(g => ({ g, L: touch(g) })).sort((a, b) => b.L - a.L).map(x => { if (opts.debugAll) console.log('  caneta', x.g.color, x.g.width.toFixed(2), 'pontas de vinco encostadas', Math.floor(x.L)); return x.g; });
      const cutW = solids.length && (hasCrease || hasPerf) ? solids[0].width : 0;
      const use = groups.filter(g => g.width >= minW && (g.kind !== CUT || g.width >= cutW * 0.6));
      const how = hasCrease ? 'tracejado' : hasPerf ? 'traço-ponto' : 'contínuo';
      if (use.length) variants.push({ color, groups: use, hasCrease: hasCrease || hasPerf, how });
      // às vezes o corte é mais fino que o vinco: tenta também com todas as espessuras (só se a leitura normal falhar)
      if (use.length < groups.length) variants.push({ color, groups, hasCrease: hasCrease || hasPerf, how: how + ' (todas)', fallback: true });
      if (!hasCrease && !hasPerf) {
        const solid = gs.filter(g => g.kind === CUT && g.length > pageDiag * 0.05).sort((a, b) => a.width - b.width);
        if (solid.length >= 2 && solid[solid.length - 1].width > solid[0].width * 1.7) {
          const thin = solid[0];
          variants.push({ color, groups: gs.filter(g => g.width >= thin.width * 0.9).map(g => g === thin ? as(g, CREASE) : g), hasCrease: true, how: 'espessura' });
        }
      }
    }
    const colors = [...byColor.entries()].map(([c, gs]) => ({ c, gs, len: lenOf(gs), box: gs.reduce((b, g) => [Math.min(b[0], g.x0), Math.min(b[1], g.y0), Math.max(b[2], g.x1), Math.max(b[3], g.y1)], [1e9, 1e9, -1e9, -1e9]) }))
      .filter(x => x.len > pageDiag * 0.3).sort((a, b) => b.len - a.len).slice(0, 5);
    for (const A of colors) for (const B of colors) {
      if (A === B) continue;
      const pad = Math.max(A.box[2] - A.box[0], A.box[3] - A.box[1]) * 0.02;
      if (!(B.box[0] >= A.box[0] - pad && B.box[1] >= A.box[1] - pad && B.box[2] <= A.box[2] + pad && B.box[3] <= A.box[3] + pad)) continue;
      const bs = B.gs.filter(g => g.kind === CUT && g.length > pageDiag * 0.05);
      if (!bs.length || A.gs.some(g => g.kind === CREASE) || A.len < B.len * 0.3) continue;
      variants.push({ color: A.c, groups: A.gs.filter(g => g.kind === CUT).concat(bs.map(g => as(g, CREASE))), hasCrease: true, how: 'cor ' + B.c });
    }
    const goodEnough = () => results.some(r => !r.error && r.hinges.length >= 3);
    for (const v of variants.sort((a, b) => !!a.fallback - !!b.fallback)) {
      if (v.fallback && goodEnough()) continue;
      try {
        const r = build(vec, v.groups, v.hasCrease, opts);
        r.color = v.color; r.creaseBy = v.how;
        // sem marcação de vinco, qualquer linha vira dobra: só vale se nada melhor aparecer
        if (!v.hasCrease) r.score *= 0.3;
        results.push(r);
      } catch (e) { results.push({ color: v.color, how: v.how, error: e.message }); }
    }
    if (opts.debugAll) results.forEach(r => console.log('variante', r.color, r.creaseBy || r.how, r.error || `painéis ${r.panels.length} vincos ${r.hinges.length} soltos ${r.slits.length} score ${r.score.toFixed(1)}`));
    // prioridade pela força da evidência: vinco tracejado > vinco por cor/espessura > sem marcação
    const level = r => /^tracejado|^traço-ponto/.test(r.creaseBy || '') ? 3 : /^cor|^espessura/.test(r.creaseBy || '') ? 2 : 1;
    const ok = results.filter(r => !r.error).sort((a, b) => ((b.hinges.length >= 3) - (a.hinges.length >= 3)) || (level(b) - level(a)) || (b.score - a.score));
    if (!ok.length) { const e = new Error('Não encontrei a faca no PDF.'); e.details = results; throw e; }
    return ok[0];
  }

  function build(vec, groups, hasCrease, opts) {
    // segmentos
    let segs = [];
    groups.forEach(g => g.paths.forEach(pi => {
      const p = vec.paths[pi];
      for (const s of p.subs) {
        const pts = s.pts.slice();
        if (s.closed && pts.length > 2) pts.push(pts[0]);
        for (let k = 1; k < pts.length; k++) if (len(sub(pts[k], pts[k - 1])) > 1e-6) segs.push({ a: pts[k - 1], b: pts[k], kind: g.kind, src: pi });
      }
    }));
    if (segs.length < 8) throw new Error('poucos traços');
    // agrupamento em componentes conectadas (para separar o desenho principal do "perfil", cotas soltas etc.)
    let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
    for (const s of segs) for (const p of [s.a, s.b]) { bx0 = Math.min(bx0, p[0]); by0 = Math.min(by0, p[1]); bx1 = Math.max(bx1, p[0]); by1 = Math.max(by1, p[1]); }
    const tolC = Math.hypot(bx1 - bx0, by1 - by0) * 0.004;
    const comps = components(segs, tolC);
    // componente principal: maior caixa envolvente que tenha vincos (ou a maior)
    comps.forEach(c => { c.area = (c.x1 - c.x0) * (c.y1 - c.y0); c.creases = c.segs.filter(s => segs[s].kind === CREASE).length; });
    const withC = comps.filter(c => c.creases > 0);
    const main = (withC.length ? withC : comps).sort((a, b) => b.area - a.area)[0];
    const pad = tolC;
    const inside = comps.filter(c => c === main || (c.x0 >= main.x0 - pad && c.x1 <= main.x1 + pad && c.y0 >= main.y0 - pad && c.y1 <= main.y1 + pad));
    segs = inside.flatMap(c => c.segs.map(i => segs[i]));
    const W = main.x1 - main.x0, H = main.y1 - main.y0, D = Math.hypot(W, H);
    const maxW = Math.max(...groups.map(g => g.width));
    const tol = opts.tol || Math.max(D * 0.0008, maxW * 0.8);
    extendDangling(segs, tol, D * 0.012);
    let structural = segs.filter(s => s.kind !== PERF);
    let graph = buildGraph(structural.map(s => ({ ...s })), tol);
    let F = faces(graph);
    // picotes retos que atravessam a estrutura de ponta a ponta são vincos picotados (ex.: parede dupla, "canoa")
    const srcLen = new Map();
    for (const s of structural) srcLen.set(s.src, (srcLen.get(s.src) || 0) + len(sub(s.b, s.a)));
    const aliveSegs = structural.filter(s => srcLen.get(s.src) > D * 0.03);
    const distTo = p => { let m = Infinity; for (const s of aliveSegs) { const d = sub(s.b, s.a), L2 = dot(d, d); const t = L2 ? Math.max(0, Math.min(1, dot(sub(p, s.a), d) / L2)) : 0; m = Math.min(m, len(sub(p, lerp(s.a, s.b, t)))); } return m; };
    const perfBySrc = new Map();
    segs.filter(s => s.kind === PERF).forEach(s => { let a = perfBySrc.get(s.src); if (!a) perfBySrc.set(s.src, a = []); a.push(s); });

// Alguns programas exportam as linhas da faca como formas preenchidas finas ("contorno do traço").

      itemForma: field(texts, ['Item Forma:', 'Item da Forma:']),
      interna: field(texts, ['Med. Interna:', 'Medidas Internas:', 'M.I.:']),
      imp: field(texts, ['Ajustes Imp.:']),
      ond: field(texts, ['Ajustes Ond.:']),
      vista: field(texts, ['Vista:']),
      po: field(texts, ['PO:']),
      onda: field(texts, ['Onda:']),
      estilo: field(texts, ['Estilo:']),
      obs: field(texts, ['Obs.:']),

    if (!SX) {
      const cand = texts.map(t => ({ v: parseFloat(t.str.replace(',', '.')), t })).filter(c => /^\s*\d{2,5}([.,]\d+)?\s*$/.test(c.t.str) && c.v > 10);

      if (mi.length === 3) {
        let best = null;
        for (const p of dl.panels) {
          let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
          for (const q of p.poly) { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }

            const sx = (x1 - x0) / mi[i], sy = (y1 - y0) / mi[j];
            if (Math.abs(sx - sy) / sx < 0.04 && (!best || p.area > best.area)) best = { area: p.area, sx, sy };
          }

        if (best) { SX = SY = (best.sx + best.sy) / 2; source = 'medidas internas'; }
      }
    }
    if (!SX) { SX = SY = 72 / 25.4; source = 'tamanho real do PDF'; }
    const mirror = kind === 'tecnica' ? !/extern/i.test(info.vista || 'interna') : /intern/i.test(info.vista || '');
    const fl = flute(info.onda) || flute((info.po || '').split(/\s+/).pop()) || { onda: '?', esp: 3 };

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAf/Z", "name": "_padrao.pdf"};
// ===== Aplicativo =====
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = v => (Math.round(v * 10) / 10).toLocaleString('pt-BR');
  if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const V = Viewer.create($('c'));
  let sheets = [];          // fichas carregadas
  let cur = null;           // caixa em exibição
  let fold = 1, anim = null, spin = false, sel = -1, panel = null, selLine = null;
  let thickness = null;     // espessura escolhida pelo usuário (mm) ou automática
  let preferTech = false;   // usar a geometria da ficha técnica mesmo havendo faca na de impressão
  let piece = 0;            // folha com várias caixas: qual montar
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- utilidades de interface ----------
  function setBusy(t) { $('busy').hidden = !t; if (t) $('busy').textContent = t; }
  function showMsg(t) { $('msg').hidden = !t; $('msg').textContent = t || ''; }
  let toastT = 0;
  function toast(t) { $('toast').textContent = t; $('toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $('toast').hidden = true, 2600); }

  // ---------- estilos salvos ----------
  const KEY = 'montador-caixa-estilos';
  const signature = m => `${m.faces.length}-${m.hinges.length}-${Math.round(m.W / 5) * 5}x${Math.round(m.H / 5) * 5}`;
  const loadStyles = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
  const saveStyles = o => { try { localStorage.setItem(KEY, JSON.stringify(o)); return true; } catch (e) { return false; } };

  // ---------- leitura dos PDFs ----------
  async function addFiles(files) {
    const pdfs = [...files].filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
    if (!pdfs.length) { showMsg('Envie arquivos PDF.'); return; }
    if (!window.pdfjsLib) { showMsg('Não consegui carregar o leitor de PDF. Verifique a conexão e recarregue a página.'); return; }
    showMsg(null);
    for (const file of pdfs) {
      setBusy(`Lendo ${file.name}…`);
      try {
        const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
        let entry = null;
        for (let n = 1; n <= Math.min(doc.numPages, 4); n++) {
          const page = await doc.getPage(n);
          const vec = await PDFVec.read(pdfjsLib, page);
          try { const sh = Sheet.analyze(vec); entry = { name: file.name, kind: sh.kind, page, vec, sheet: sh }; break; }
          catch (e) { if (!entry) entry = { name: file.name, kind: guessKind(vec), page, vec, sheet: null, error: e.message }; }
        }
        // uma ficha de cada tipo: a nova substitui a anterior do mesmo tipo
        sheets = sheets.filter(s => s.kind !== entry.kind && !s.sample);
        sheets.push(entry);
      } catch (e) { showMsg(`Não consegui abrir ${file.name}: ${e.message}`); }
    }
    preferTech = false; sel = -1; piece = 0;
    await rebuild();
    setBusy(null);
  }
  function guessKind(vec) {
    const t = vec.texts.map(x => x.str).join(' ').toLowerCase();
    return /faca de corte|ficha de forma|item da forma/.test(t) && !/ajustes imp/.test(t) ? 'tecnica' : 'impressao';
  }

  // ---------- montagem ----------
  async function rebuild(keepView) {
    const print = sheets.find(s => s.kind !== 'tecnica'), tech = sheets.find(s => s.kind === 'tecnica');
    const printOK = print && print.sheet && print.sheet.dieline && print.sheet.dieline.hinges.length >= 3;
    const techOK = tech && tech.sheet;
    let geom = null, warns = [];
    if (preferTech && techOK) geom = tech;
    else if (printOK && !(print.sheet.outlined && techOK)) geom = print;
    else if (techOK) geom = tech;
    else if (print && print.sheet) geom = print;
    renderChips(print, tech, geom);
    if (!geom) {
      cur = null;
      showMsg('Não encontrei a faca nesse PDF. O app precisa da faca desenhada em vetor (linhas de corte e vinco). Se tiver a ficha técnica (forma), envie junto.');
      return;
    }
    setBusy('Montando a caixa…');
    const pieceList = (geom.sheet.dieline.pieces || []).map((p, i) => ({ ...p, i })).filter(p => p.copyOf < 0);
    if (!pieceList.some(p => p.i === piece)) piece = pieceList.length ? pieceList[0].i : 0;
    let { model, recipe } = Styles.auto(geom.sheet, { thickness: thickness || undefined, piece });
    const sig = signature(model) + (piece ? '-p' + piece : '');
    const saved = loadStyles()[sig];
    const auto = JSON.parse(JSON.stringify(recipe));
    if (saved) { recipe = { ...recipe, ...saved, prog: { ...recipe.prog, ...saved.prog }, savedStyle: true }; }
    // arte
    let art = null, hide = null, colors = [];
    if (print && print.page && (print.sheet || geom === tech)) {
      const region = print.sheet ? print.sheet.dieline.bbox : null;
      if (region) {
        const prev = cur && cur.printName === print.name ? cur.hide : null;
        hide = prev || defaultHide(print);
        colors = layerColors(print);
        art = await Texture.renderArt(print.page, region, hide, Math.min(4096, V.renderer.capabilities.maxTextureSize));
        Texture.overlayCuts(art, model);
      } else warns.push('a ficha de impressão não tem a faca, então a arte não pôde ser posicionada');
    }
    if (!art) art = Texture.kraft(model, 2048);
    if (print && !print.sheet && !techOK) warns.push(print.error || 'faca não encontrada');
    // problemas do próprio arquivo (texto em curvas, campos fora do lugar, medida que não bate com a faca)
    const fileProblems = [...(geom.sheet.problems || []), ...Styles.checkMeasures(geom.sheet, model, recipe)];
    fileProblems.forEach(p => warns.push('problema no arquivo: ' + p));
    if (geom.sheet.scaleSource === 'tamanho real do PDF' && !fileProblems.some(p => /texto legível/.test(p))) warns.push('não achei as medidas escritas na ficha; usei o tamanho do desenho');
    else if (geom.sheet.scaleSource === 'tamanho real do PDF') warns.push('usei o tamanho do desenho no PDF');
    if (geom.sheet.outlined) warns.push('a faca veio como contorno preenchido e foi reconstruída; confira os detalhes ou envie também a ficha técnica');
    if (print && tech && print.sheet && tech.sheet) {
      const c = compare(print.sheet, tech.sheet);
      if (c.bad) warns.push(`a conferência encontrou ${c.bad} diferença${c.bad > 1 ? 's' : ''} entre as fichas (abra "Conferência")`);
    }
    cur = { model, recipe, auto, art, hide, colors, geom, print, tech, sig, printName: print && print.name, warns, pieceList };
    V.setBox({ model, recipe, art });
    fold = 1; $('fold').value = 1000; V.setT(1); updPlay(); renderTicks();
    if (!keepView) V.frame('iso', true);
    renderSpecs(); renderSide();
    showMsg(warns.length ? 'Atenção: ' + warns.join('; ') + '.' : null);
    if (saved) toast('Estilo salvo para esta faca aplicado');
    setBusy(null);
  }
  function defaultHide(print) {
    const stroke = new Set(), fill = new Set(), text = new Set();
    if (print.sheet && !print.sheet.outlined) stroke.add(print.sheet.dieline.color);
    if (print.sheet && print.sheet.outlined) fill.add(print.sheet.dieline.color);
    // cotas escritas na cor da faca (comum em fichas de outros fornecedores): somem da arte quando a cor não é preta
    if (print.sheet) { const c = print.sheet.dieline.color, [r, g, b] = [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); if (0.3 * r + 0.59 * g + 0.11 * b > 70) { text.add(c); fill.add(c); } }
    print.vec.paths.forEach(p => {
      if (p.stroke && Texture.isAnnotation(p.stroke)) stroke.add(p.stroke);
      if (p.fill && Texture.isAnnotation(p.fill)) fill.add(p.fill);
    });
    return { stroke, fill, text };
  }
  function layerColors(print) {
    const m = new Map();
    print.vec.paths.forEach(p => { if (p.stroke) m.set(p.stroke, (m.get(p.stroke) || 0) + 1); });
    const list = [...m.entries()].filter(([c]) => !/^#f[0-9a-f]f[0-9a-f]f[0-9a-f]$/.test(c)).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([c]) => c);
    if (print.sheet && !list.includes(print.sheet.dieline.color)) list.unshift(print.sheet.dieline.color);
    return list;
  }

  // ---------- conferência entre ficha de impressão e ficha técnica ----------
  function measures(sheet) {
    const { model: m, recipe: r } = Styles.auto(sheet);
    const tr = Fold.tree(m, r.root);
    const { M } = Fold.poses(m, tr, r.prog, 1, null);
    const box = new THREE.Box3(), v = new THREE.Vector3();
    m.faces.forEach((F, f) => { if (M[f]) F.poly.forEach(p => box.expandByPoint(v.set(p[0], p[1], 0).applyMatrix4(M[f]))); });
    const s = box.getSize(new THREE.Vector3());
    const rsc = Styles.detectRSC(m);
    let panels = null, body = null;
    if (rsc) { panels = rsc.panels.map(f => m.faces[f].w).sort((a, b) => a - b); body = m.faces[rsc.panels[0]].h; }
    const dims = [s.x, s.y, s.z].sort((a, b) => b - a);
    return { model: m, W: m.W, H: m.H, panels, body, dims, faces: m.faces.length, hinges: m.hinges.length, interna: sheet.info.interna };
  }
  function compare(a, b) {
    const A = measures(a), B = measures(b), rows = [];
    const tol = 2.5;
    const add = (label, x, y) => rows.push({ label, x, y, bad: x != null && y != null && Math.abs(x - y) > tol });
    add('Chapa aberta — largura', A.W, B.W);
    add('Chapa aberta — altura', A.H, B.H);
    if (A.panels && B.panels) A.panels.forEach((p, i) => add(`Painel ${i + 1}`, p, B.panels[i]));
    if (A.body && B.body) add('Altura do corpo', A.body, B.body);
    ['Montada — maior', 'Montada — média', 'Montada — menor'].forEach((l, i) => add(l, A.dims[i], B.dims[i]));
    add('Painéis encontrados', A.faces, B.faces); rows[rows.length - 1].count = true; rows[rows.length - 1].bad = A.faces !== B.faces;
    add('Vincos encontrados', A.hinges, B.hinges); rows[rows.length - 1].count = true; rows[rows.length - 1].bad = A.hinges !== B.hinges;
    return { A, B, rows, bad: rows.filter(r => r.bad).length };
  }

  // ---------- painéis de interface ----------
  function renderChips(print, tech, geom) {
    const chip = (s, role) => s ? `<span class="chip"><span class="role">${role}</span><b>${esc(s.name)}</b>${s === geom ? ' <span class="role">· faca</span>' : ''}<button data-rm="${esc(s.name)}" aria-label="Remover ${esc(s.name)}">×</button></span>` : '';
    $('chips').innerHTML = chip(print && print.sample ? null : print, 'Impressão') + chip(tech, 'Técnica');
    $('chips').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { sheets = sheets.filter(s => s.name !== b.dataset.rm); if (sheets.length) rebuild(); else loadSample(); });
    const main = print || tech;
    const info = main && main.sheet ? main.sheet.info : {};
    $('title').innerHTML = esc(info.produto || info.cliente || (main ? main.name.replace(/\.pdf$/i, '') : 'Caixa')) + (info.item ? `<small>item ${esc(info.item)}</small>` : '');
  }
  function boxDims() {
    const st = V.state; if (!st) return null;
    const { M } = Fold.poses(st.model, st.tr, st.recipe.prog, 1, st.offsets);
    const box = new THREE.Box3(), v = new THREE.Vector3();
    st.model.faces.forEach((F, f) => { if (M[f]) F.poly.forEach(p => box.expandByPoint(v.set(p[0], p[1], 0).applyMatrix4(M[f]))); });
    const s = box.getSize(new THREE.Vector3());
    return [s.x, s.y, s.z];
  }
  function renderSpecs() {
    if (!cur) { $('specs').innerHTML = ''; return; }
    const g = cur.geom.sheet, d = boxDims() || [0, 0, 0];
    const outer = cur.recipe.orient === 'base' ? [d[0], d[1], d[2]] : [d[0], d[2], d[1]];
    const okSrc = g.scaleSource !== 'tamanho real do PDF';
    $('specs').innerHTML = `
      <span class="style">${esc(cur.recipe.label)}${cur.recipe.savedStyle ? ' · estilo salvo' : ''}</span>
      ${cur.pieceList && cur.pieceList.length > 1 ? `<span class="pieces" role="group" aria-label="Peças da folha">Peça ${cur.pieceList.map((p, k) => `<button data-piece="${p.i}" class="${p.i === piece ? 'on' : ''}">${k + 1}</button>`).join('')}</span>` : ''}
      <span>Montada <b>${outer.map(v => Math.round(v)).join(' × ')}</b> mm</span>
      <span>Chapa <b>${Math.round(cur.model.W)} × ${Math.round(cur.model.H)}</b></span>
      ${g.info.interna ? `<span>Interna <b>${esc(g.info.interna)}</b></span>` : ''}
      <span>Papelão <b>${fmt(cur.model.thickness)} mm</b>${g.flute && g.flute.onda !== '?' && !thickness ? ` (onda ${esc(g.flute.onda)})` : ''}</span>
      <span class="src ${okSrc ? 'ok' : 'warn'}">Escala: ${esc(g.scaleSource)}</span>
      <span class="tools">
        <button data-panel="dobras" class="${panel === 'dobras' ? 'on' : ''}">Dobras</button>
        <button data-panel="conf" class="${panel === 'conf' ? 'on' : ''}">Conferência</button>
        <button data-panel="arte" class="${panel === 'arte' ? 'on' : ''}">Arte e papelão</button>
      </span>`;
    $('specs').querySelectorAll('[data-piece]').forEach(b => b.onclick = () => { piece = +b.dataset.piece; sel = -1; rebuild(); });
    $('specs').querySelectorAll('[data-panel]').forEach(b => b.onclick = () => { panel = panel === b.dataset.panel ? null : b.dataset.panel; renderSpecs(); renderSide(); });
  }
  function renderSide() {
    const el = $('side'), wasHidden = el.hidden;
    if (!panel || !cur) { el.hidden = true; clearSel(); if (!wasHidden) setTimeout(() => V.frame('iso'), 60); return; }
    el.hidden = false;
    const close = `<button data-close aria-label="Fechar painel">×</button>`;
    if (panel === 'dobras') el.innerHTML = editorHTML(close);
    else if (panel === 'conf') el.innerHTML = confHTML(close);
    else el.innerHTML = arteHTML(close);
    el.querySelector('[data-close]').onclick = () => { panel = null; renderSpecs(); renderSide(); };
    if (panel === 'dobras') bindEditor(); else if (panel === 'conf') drawOverlay(); else bindArte();
    if (el.hidden !== wasHidden) setTimeout(() => V.frame('iso'), 60);
  }

  // ---------- editor de dobras ----------
  function editorHTML(close) {
    const st = V.state, m = cur.model, r = cur.recipe;
    let selHTML = '<p>Clique num painel da caixa para editar a dobra dele.</p>';
    if (sel >= 0 && st && st.tr.depth[sel] >= 0) {
      const F = m.faces[sel], par = st.tr.parent[sel];
      if (par < 0) selHTML = `<div class="sel"><div class="t">Painel ${F.id}<span>${Math.round(F.w)} × ${Math.round(F.h)} mm</span></div><p>Este é o painel base: fica parado e os outros dobram em volta dele.</p></div>`;
      else {
        const hid = st.tr.via[sel], p = r.prog[hid] || { angle: 0, stage: 1 };
        selHTML = `<div class="sel">
          <div class="t">Painel ${F.id}<span>${Math.round(F.w)} × ${Math.round(F.h)} mm · preso ao ${m.faces[par].id}</span></div>
          <div class="field"><label for="ang">Ângulo da dobra (graus)</label>
            <div class="row"><input type="number" id="ang" step="5" value="${p.angle}">
              ${[-180, -90, 0, 90, 180].map(a => `<button data-a="${a}">${a > 0 ? '+' : ''}${a}°</button>`).join('')}</div>
            <p>Positivo dobra para dentro (o lado impresso fica para fora). Negativo dobra ao contrário.</p></div>
          <div class="field"><label for="stg">Etapa</label>
            <div class="row"><button data-s="-1" aria-label="Etapa anterior">−</button><input type="number" id="stg" step="0.5" value="${p.stage}"><button data-s="1" aria-label="Próxima etapa">+</button></div>
            <p>Painéis da mesma etapa dobram juntos; quem dobra depois fica por cima.</p></div>
          <div class="row"><button id="mkroot">Usar como painel base</button></div>
        </div>`;
      }
    }
    return `<h2>Dobras ${close}</h2>
      ${selHTML}
      <div class="field"><span class="lbl">Posição da caixa</span>
        <div class="row"><button data-or="front" class="${r.orient !== 'base' ? 'on' : ''}">Em pé</button><button data-or="base" class="${r.orient === 'base' ? 'on' : ''}">Deitada (pelo fundo)</button></div></div>
      ${(r.notes || []).map(n => `<p>${esc(n)}</p>`).join('')}
      <div class="field"><span class="lbl">Estilo desta faca</span>
        <div class="row"><button id="savest">Salvar estilo</button><button id="resetst">Voltar ao automático</button></div>
        <p>O estilo salvo é aplicado sozinho quando uma faca igual for aberta neste navegador.</p>
        <div class="row"><button id="copyst">Copiar estilo</button><button id="pastest">Colar estilo</button></div>
        <textarea id="sttext" hidden placeholder="Cole aqui o estilo copiado e clique em Aplicar"></textarea>
        <div class="row"><button id="applyst" hidden>Aplicar</button></div></div>`;
  }
  function bindEditor() {
    const st = V.state, r = cur.recipe;
    const hid = sel >= 0 && st.tr.parent[sel] >= 0 ? st.tr.via[sel] : null;
    const set = (k, v) => { if (hid == null) return; r.prog[hid] = { ...(r.prog[hid] || { angle: 90, stage: 1 }), [k]: v }; r.savedStyle = false; applyRecipe(); };
    const ang = $('ang'), stg = $('stg');
    if (ang) ang.onchange = () => set('angle', +ang.value || 0);
    document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => set('angle', +b.dataset.a));
    if (stg) stg.onchange = () => set('stage', +stg.value || 0);
    document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => set('stage', (r.prog[hid]?.stage || 0) + (+b.dataset.s)));
    const mk = $('mkroot'); if (mk) mk.onclick = () => { r.root = sel; applyRecipe(); };
    document.querySelectorAll('[data-or]').forEach(b => b.onclick = () => { r.orient = b.dataset.or; applyRecipe(true); });
    $('savest').onclick = () => {
      const all = loadStyles(); all[cur.sig] = { root: r.root, orient: r.orient, prog: r.prog, label: r.label };
      toast(saveStyles(all) ? 'Estilo salvo para esta faca' : 'Este navegador não permite salvar; use "Copiar estilo"');
      r.savedStyle = true; renderSpecs();
    };

      const txt = JSON.stringify({ sig: cur.sig, root: r.root, orient: r.orient, prog: r.prog });

      catch (e) { const t = $('sttext'); t.hidden = false; t.value = txt; t.select(); toast('Selecionado: copie com Ctrl+C'); }
    };
    $('pastest').onclick = () => { $('sttext').hidden = false; $('applyst').hidden = false; $('sttext').value = ''; $('sttext').focus(); };
    $('applyst').onclick = () => {
      try {
        const o = JSON.parse($('sttext').value);
        if (o.root == null || !o.prog) throw new Error();
        Object.assign(r, { root: o.root, orient: o.orient || r.orient, prog: o.prog }); applyRecipe(true);
        toast(o.sig && o.sig !== cur.sig ? 'Estilo aplicado (era de uma faca diferente; confira)' : 'Estilo aplicado');
      } catch (e) { toast('Esse texto não é um estilo válido'); }
    };
  }
  function applyRecipe(reframe) {
    const T = fold;

    V.setT(T); renderTicks();
    if (reframe) V.frame('iso', true);
    renderSpecs(); renderSide(); highlight();
  }
  function clearSel() { if (selLine) { selLine.parent && selLine.parent.remove(selLine); selLine.geometry.dispose(); selLine = null; } }
  function highlight() {
    clearSel();
    const st = V.state; if (sel < 0 || !st || !st.objs[sel] || panel !== 'dobras') return;
    const mesh = st.objs[sel];
    selLine = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 25), new THREE.LineBasicMaterial({ color: getComputedStyle(document.documentElement).getPropertyValue('--sel').trim() || '#2a6fdb', depthTest: false }));
    selLine.renderOrder = 10; mesh.add(selLine);
  }

  // ---------- conferência ----------
  function confHTML(close) {
    const { print, tech } = cur;
    if (!(print && tech && print.sheet && tech.sheet)) {
      return `<h2>Conferência ${close}</h2><p>Envie também a outra ficha (a de impressão e a técnica) para conferir as medidas uma contra a outra.</p>

    }
    const c = compare(print.sheet, tech.sheet);
    cur.conf = c;
    const cell = (v, r) => v == null ? '—' : r.count ? v : fmt(v);
    return `<h2>Conferência ${close}</h2>
      <p>${c.bad ? `<b>${c.bad}</b> diferença${c.bad > 1 ? 's' : ''} acima de 2,5 mm.` : 'As duas fichas batem (diferenças até 2,5 mm).'}</p>
      <div style="overflow-x:auto"><table class="conf"><thead><tr><th>Medida</th><th>Impressão</th><th>Técnica</th></tr></thead><tbody>
      ${c.rows.map(r => `<tr><td>${r.label}</td><td>${cell(r.x, r)}</td><td class="${r.bad ? 'bad' : r.x != null && r.y != null ? 'good' : ''}">${cell(r.y, r)}</td></tr>`).join('')}
      </tbody></table></div>
      <canvas class="overlay" id="ov"></canvas>
      <div class="legend"><span><i style="background:var(--accent)"></i>Impressão</span><span><i style="background:var(--fg)"></i>Técnica</span></div>
      <div class="field"><span class="lbl">Montar com a faca da</span>
        <div class="row"><button data-g="print" class="${cur.geom === print ? 'on' : ''}">Ficha de impressão</button><button data-g="tech" class="${cur.geom === tech ? 'on' : ''}">Ficha técnica</button></div></div>`;
  }
  function drawOverlay() {
    document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { preferTech = b.dataset.g === 'tech'; rebuild(true).then(() => { panel = 'conf'; renderSpecs(); renderSide(); }); });
    const cv = $('ov'); if (!cv || !cur.conf) return;
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio);
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext('2d'), A = cur.conf.A.model, B = cur.conf.B.model;
    const W = Math.max(A.W, B.W), H = Math.max(A.H, B.H), s = Math.min(cv.width / W, cv.height / H) * 0.92;
    const css = getComputedStyle(document.documentElement);
    const draw = (m, color, dash) => {
      ctx.strokeStyle = color; ctx.lineWidth = 1.4 * dpr; ctx.setLineDash(dash);
      for (const F of m.faces) { ctx.beginPath(); F.poly.forEach((p, i) => { const x = cv.width / 2 + p[0] * s, y = cv.height / 2 - p[1] * s; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.stroke(); }
    };
    draw(A, css.getPropertyValue('--accent').trim(), []);
    draw(B, css.getPropertyValue('--fg').trim(), [4 * dpr, 3 * dpr]);
  }

  // ---------- arte e papelão ----------
  function arteHTML(close) {
    const t = cur.model.thickness;
    const opts = [['', 'Automática'], ['1.6', 'Onda E — 1,6 mm'], ['3', 'Onda B — 3 mm'], ['4', 'Onda C — 4 mm'], ['4.5', 'Onda EB — 4,5 mm'], ['6.5', 'Onda BC — 6,5 mm']];
    return `<h2>Arte e papelão ${close}</h2>
      <div class="field"><label for="esp">Espessura do papelão</label>
        <select id="esp">${opts.map(([v, l]) => `<option value="${v}" ${String(thickness ?? '') === v ? 'selected' : ''}>${l}${!v ? ` (${fmt(t)} mm)` : ''}</option>`).join('')}</select></div>
      ${cur.hide ? `<div class="field"><span class="lbl">Traços escondidos na arte</span>
        <p>A faca e as cotas técnicas não são impressas. Marque o que deve sumir da arte.</p>
        <div class="layers">${cur.colors.map(c => `<label><input type="checkbox" data-col="${c}" ${cur.hide.stroke.has(c) ? 'checked' : ''}><span class="sw" style="background:${c}"></span>${cur.print.sheet && c === cur.print.sheet.dieline.color ? 'Faca' : c}</label>`).join('')}</div></div>` : '<p>Esta caixa está sem arte (só a ficha técnica foi enviada), então aparece em kraft liso com os picotes marcados.</p>'}`;
  }
  function bindArte() {
    $('esp').onchange = e => { thickness = e.target.value ? +e.target.value : null; rebuild(true).then(() => { panel = 'arte'; renderSpecs(); renderSide(); }); };
    document.querySelectorAll('[data-col]').forEach(cb => cb.onchange = async () => {
      cb.checked ? cur.hide.stroke.add(cb.dataset.col) : cur.hide.stroke.delete(cb.dataset.col);
      setBusy('Redesenhando a arte…');
      try {
        cur.art = await Texture.renderArt(cur.print.page, cur.print.sheet.dieline.bbox, cur.hide, Math.min(4096, V.renderer.capabilities.maxTextureSize));
        Texture.overlayCuts(cur.art, cur.model); applyRecipe();
      } finally { setBusy(null); }
    });
  }

  // ---------- controles de dobra ----------
  function renderTicks() {
    const st = V.state; const n = st ? Fold.timeline(st.recipe.prog).stages.length : 1;
    const k = Math.min(n, Math.max(0, Math.ceil(fold * n - 1e-6)));
    $('ticks').innerHTML = `<span class="${fold < 0.01 ? 'act' : ''}">Aberta</span><span class="${fold > 0.01 && fold < 0.99 ? 'act' : ''}">${fold > 0.01 && fold < 0.99 ? `Etapa ${k} de ${n}` : `${n} etapas`}</span><span class="${fold >= 0.99 ? 'act' : ''}">Montada</span>`;
    $('pct').textContent = Math.round(fold * 100) + '%';
  }
  function updPlay() { $('play').textContent = fold > .5 ? 'Abrir' : 'Montar'; }
  $('fold').oninput = e => { anim = null; fold = e.target.value / 1000; V.setT(fold); renderTicks(); updPlay(); };
  $('play').onclick = () => {
    const to = fold > .5 ? 0 : 1;
    if (reduced) { fold = to; $('fold').value = fold * 1000; V.setT(fold); renderTicks(); updPlay(); V.frame(to ? 'iso' : 'top'); return; }
    const n = V.state ? Fold.timeline(V.state.recipe.prog).stages.length : 3;
    anim = { from: fold, to, t: 0, dur: Math.min(9, 1.6 + n * 0.75) };
    if (!to) V.frame(cur && cur.recipe.orient === 'base' ? 'top' : 'front');
  };
  $('spin').onclick = e => { spin = !spin; e.currentTarget.classList.toggle('on', spin); V.controls.autoRotate = spin; V.controls.autoRotateSpeed = 1.5; };
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => V.frame(b.dataset.view));
  let last = performance.now();
  (function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (anim) {
      anim.t = Math.min(1, anim.t + dt / anim.dur);
      fold = anim.from + (anim.to - anim.from) * anim.t;
      $('fold').value = fold * 1000; V.setT(fold); renderTicks();
      if (anim.t >= 1) { anim = null; updPlay(); if (fold > .5) V.frame('iso'); }
    }
    requestAnimationFrame(tick);
  })(last);

  // seleção de painel (clique sem arrastar)
  let down = null;
  $('c').addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
  $('c').addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5 || !cur) return;
    const r = $('c').getBoundingClientRect();
    const hit = V.pick(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    if (!hit) return;
    sel = hit.face;
    if (panel !== 'dobras') { panel = 'dobras'; renderSpecs(); }
    renderSide(); highlight();
  });

  // ---------- envio de arquivos ----------
  $('file').onchange = e => { if (e.target.files.length) addFiles(e.target.files); e.target.value = ''; };
  let dragN = 0;
  addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('drop').hidden = false; });
  addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) $('drop').hidden = true; });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('drop').hidden = true; if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

  // ---------- exemplo inicial ----------
  async function loadSample() {
    const img = new Image();
    await new Promise(res => { img.onload = res; img.onerror = res; img.src = SAMPLE.art; });
    const cv = document.createElement('canvas'); cv.width = img.naturalWidth || 2; cv.height = img.naturalHeight || 2;
    cv.getContext('2d').drawImage(img, 0, 0);
    const sheet = SAMPLE.sheet;
    const { model, recipe } = Styles.auto(sheet);
    sheets = [{ name: SAMPLE.name, kind: 'impressao', sheet, sample: true }];
    cur = { model, recipe, auto: JSON.parse(JSON.stringify(recipe)), art: cv, hide: null, colors: [], geom: sheets[0], print: null, tech: null, sig: signature(model), warns: [] };
    renderChips(sheets[0], null, sheets[0]);
    $('title').innerHTML = `Caixa padrão<small>envie o seu PDF para montar a sua caixa</small>`;
    V.setBox({ model, recipe, art: cv }); fold = 1; V.setT(1); V.frame('iso', true);
    renderTicks(); updPlay(); renderSpecs(); showMsg(null);
  }
  window.__montador = { addFiles, get cur() { return cur; }, V, setFold: v => { fold = v; $('fold').value = v * 1000; V.setT(v); renderTicks(); } };
  loadSample();
})();

</script>
